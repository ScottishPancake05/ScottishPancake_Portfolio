            <div class="thumbnail-window">
              <div class="thumbnails">

                <img src="../Assets/Images/GatInDeGrond/a.png" 
                onclick=" changeShowcase('../Assets/Images/GatInDeGrond/a.png',)" alt="Project image 1" />

                <img src="../Assets/Images/GatInDeGrond/thumbnail.png" 
                onclick=" changeShowcase('../Assets/Videos/GatInDeGrond/preview.mp4',)" alt="Project image 1" />

                onclick=" changeShowcase('../Assets/Images/GatInDeGrond/map.png',)" alt="Project image 1" />

                <img src="../Assets/Images/GatInDeGrond/map2.png" 
                onclick=" changeShowcase('../Assets/Images/GatInDeGrond/map2.png',)" alt="Project image 1" />

                onclick=" changeShowcase('../Assets/Images/GatInDeGrond/skelly.png',)" alt="Project image 1" />

              </div>
            </div>

            <button class="gallery-arrow right" onclick="scrollThumbnails(1)"> &#10095; </button>
          </div>

          <div class="project-summary"> <p> (typing...) </p> </div>
        </div>

        <div class="project-right">

            <p>
              <strong> Genre: Interactive education </strong>
            </p>

            <p>
              <strong> Platform: Mobile </strong>
            </p>

              <strong> Year: 2025-2026 </strong>
